name: ihatefiles
options:
  bundleIdPrefix: com.mateoshkodra
  deploymentTarget:
    macOS: "15.0"
targets:
  ihatefiles:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "CLAUDE.md"
      - path: Core
        excludes:
          - "CLAUDE.md"
      - path: Downloaders
        excludes:
          - "CLAUDE.md"
      - path: Converters
        excludes:
          - "CLAUDE.md"
      - path: Resources
        excludes:
          - "CLAUDE.md"
          - "bin/**"
          - "Scripts/**"
      - path: Resources/bin
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Fetch vendored binaries
        script: |
                "$SRCROOT/Resources/Scripts/fetch-binaries.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ihatefiles
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
    scheme:
      testTargets:
        - ihatefilesTests

  ihatefilesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ihatefilesTests
    dependencies:
      - target: ihatefiles
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ihatefiles.app/Contents/MacOS/ihatefiles"
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
